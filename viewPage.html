<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>

    <link rel="stylesheet" href="css/viewPage.css">
    <link rel="stylesheet" href="css/cartNavbar.css">
</head>

<body>
    <div id="nav"></div>
    <main id="product">
        <div class="image">

            <img
                id="productImage"
                src=""
                alt=""
            >

        </div>

        <div class="details">

            <p
                id="productCategory"
                class="category"
            ></p>

            <h1 id="productName"></h1>

            <p
                id="productPrice"
                class="price"
            ></p>

            <p
                id="productDescription"
                class="description"
            ></p>

            <div class="size">

                <p>SELECT SIZE (US MENS)</p>

                <p>SIZE GUIDE</p>

            </div>

            <div class="sizes">

                <button>8</button>

                <button>9</button>

                <button class="selected">
                    10
                </button>

                <button>11</button>

                <button>12</button>

            </div>

            <button
                class="add"
                id="addProduct"
            >
                ADD TO BAG
            </button>

            <button class="store">
                FIND IN STORE
            </button>

            <div class="info">

                <div>

                    <small>CUSHION</small>

                    <p>FIRM/RESPONSIVE</p>

                </div>

                <div>

                    <small>SURFACE</small>

                    <p>ALL-TERRAIN</p>

                </div>

                <div>

                    <small>DROP</small>

                    <p>6MM</p>

                </div>

            </div>

        </div>

    </main>

    <script src="js/main.js"></script>

</body>

</html>
